version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - FIREBASE_PROJECT_ID=sheildx-ai-prod
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
    restart: always

  admin-dashboard:
    build:
      context: ./admin-dashboard
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: always
