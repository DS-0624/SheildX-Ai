services:
  # ------------------------------------------------------------------
  # 1. FastAPI Backend Web Service
  # ------------------------------------------------------------------
  - type: web
    name: shieldx-ai-backend
    env: python
    region: singapore # or oregon / frankfurt
    buildCommand: cd backend && pip install -r requirements.txt && pip install email-validator
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 8000
      - key: APP_NAME
        value: ShieldX AI Security Engine

  # ------------------------------------------------------------------
  # 2. React PWA Frontend Static Site
  # ------------------------------------------------------------------
  - type: web
    name: shieldx-ai-frontend
    env: static
    buildCommand: cd admin-dashboard && npm install && npm run build
    staticPublishPath: admin-dashboard/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
